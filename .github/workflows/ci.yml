name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: pnpm/setup@v3
        with:
          version: '11'
          runtime: node@24
          require-lockfile: true
      - uses: go-task/setup-task@v2
      - run: task check
