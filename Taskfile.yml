version: '3'

vars:
  PYTHON: '{{default "python" .PYTHON}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  test:
    desc: Run the Go, Python and TypeScript unit suites
    cmds:
      - task: test:go
      - task: test:python
      - task: test:typescript

  test:go:
    desc: Run Go unit tests
    cmds:
      - go test ./... {{.CLI_ARGS}}

  test:python:
    desc: Run Python unit tests
    cmds:
      - '{{.PYTHON}} -m scripts.test_python {{.CLI_ARGS}}'

  test:typescript:
    desc: Run TypeScript unit tests with Node.js
    cmds:
      - node --test {{.CLI_ARGS}} "concepts/**/*.test.ts" "problems/**/*.test.ts"

  check:
    desc: Run all tests, TypeScript type checking and Go static analysis
    cmds:
      - task: test
      - task: check:typescript
      - go vet ./...

  check:typescript:
    desc: Check implementation types with the project TypeScript compiler
    cmds:
      - pnpm exec tsc --noEmit

  fmt:go:
    desc: Format Go implementations and tests
    cmds:
      - go fmt ./...
